
name: Monitorización TCAE SCS

on:
  workflow_dispatch:

concurrency:
  group: monitorizacion-tcae-scs
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-bot-tcae:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar el script web TCAE
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TCAE }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TZ: Atlantic/Canary
        run: python tiempo_real_tcae.py

      - name: Subir HTML de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-tcae
          path: debug_*.html
          if-no-files-found: ignore

      - name: Guardar estado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add estado_tcae_*.txt || true
          git commit -m "Actualizar estados TCAE [skip ci]" -a || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push || echo "::warning::El push de estado_tcae_*.txt ha fallado; revisar manualmente si persiste"
